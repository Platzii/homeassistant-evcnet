start_charging:
  name: Start charging
  description: Start a charging session with an optional RFID card ID
  target:
    entity:
      domain: switch
      integration: evcnet
  fields:
    card_id:
      name: Charge card ID
      description: Optional charge card ID (e.g. NL-TNM-C12345-6) to use for this session. If not provided, uses the card configured in the integration or the card linked to the charging station.
      required: false
      selector:
        text:

stop_charging:
  name: Stop charging
  description: Stop the current charging session
  target:
    entity:
      domain: switch
      integration: evcnet

refresh_status:
  name: Refresh status
  description: Immediately fetch the latest status from the 50five API
  target:
    entity:
      domain: switch
      integration: evcnet

soft_reset:
  name: Soft reset
  description: Perform a soft reset on the charging station
  target:
    entity:
      domain: switch
      integration: evcnet

hard_reset:
  name: Hard reset
  description: Perform a hard reset on the charging station
  target:
    entity:
      domain: switch
      integration: evcnet

unlock_connector:
  name: Unlock connector
  description: Unlock the connector on the charging station
  target:
    entity:
      domain: switch
      integration: evcnet
