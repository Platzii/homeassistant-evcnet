name: Test authentication
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: ruff check custom_components/evcnet/api.py custom_components/evcnet/config_flow.py custom_components/evcnet/coordinator.py custom_components/evcnet/session.py custom_components/evcnet/__init__.py tests
